# Gera todo dia a animação da cobrinha comendo o gráfico de contribuições.
# O resultado vai para a branch "output" e o README aponta para lá.
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # só para publicar o SVG na branch output

concurrency:
  group: cobrinha
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar a animação (claro e escuro)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5B83D&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza a cobrinha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
